<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <main class="auth-card" role="main">
    <div class="auth-brand">
      <span class="auth-mark">§</span>
      <h1>Ledger</h1>
      <p class="auth-sub">Payroll, kept precisely.</p>
    </div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" placeholder="admin@yourcompany.com" />

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />

      <button type="submit" id="login-btn" class="btn-primary">Sign in</button>
      <p id="auth-error" class="auth-error" hidden></p>
    </form>

    <p class="auth-footnote">Access is by admin invitation only. Accounts are created from the Supabase dashboard — see the README.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
